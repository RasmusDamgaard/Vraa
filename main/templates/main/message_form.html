{% extends 'main/base.html' %}

{% block content %}
<div class="message-form-container">
    <h1>{% if object %}Rediger besked{% else %}Ny besked{% endif %}</h1>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_content" class="form-label">Din besked</label>
            <textarea name="content" id="id_content" class="form-control"
                      rows="5" maxlength="2000" required>{% if form.content.value %}{{ form.content.value }}{% endif %}</textarea>
            {% if form.content.errors %}
            <div class="text-danger">{{ form.content.errors }}</div>
            {% endif %}
            <div class="form-text">Maks 2000 tegn</div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                {% if object %}Gem ændringer{% else %}Send besked{% endif %}
            </button>
            <a href="{% url 'main:frontpage' %}" class="btn btn-outline-secondary">Annuller</a>
        </div>
    </form>
</div>
{% endblock %}
