{% extends 'main/base.html' %}

{% block content %}
<div class="message-form-container">
    <h1>Tilføj kommentar</h1>

    <div class="callout mb-3">
        <small class="text-muted">Kommenterer på:</small>
        <p class="mb-0"><strong>{{ message.author.username }}</strong>: {{ message.content|truncatewords:20 }}</p>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_content" class="form-label">Din kommentar</label>
            <textarea name="content" id="id_content" class="form-control"
                      rows="3" maxlength="1000" required>{% if form.content.value %}{{ form.content.value }}{% endif %}</textarea>
            {% if form.content.errors %}
            <div class="text-danger">{{ form.content.errors }}</div>
            {% endif %}
            <div class="form-text">Maks 1000 tegn</div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Send kommentar</button>
            <a href="{% url 'main:frontpage' %}" class="btn btn-outline">Annuller</a>
        </div>
    </form>
</div>
{% endblock %}
