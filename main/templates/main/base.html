<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vraa – {{ title }}</title>

    <!-- Resource hints for faster loading -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    {% load static %}
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}" />

    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <!-- Mobile navbar with hamburger toggle -->
    <nav class="navbar navbar-light bg-light d-md-none">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Vraa</span>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#sidebarMenu"
          aria-controls="sidebarMenu"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>

    <div class="container-fluid">
      <div class="row">
        <!-- Side navigation panel -->
        <nav
          id="sidebarMenu"
          class="col-md-3 col-lg-2 d-md-block bg-light sidebar collapse"
        >
          <div class="sidebar-sticky pt-3">
            <div class="text-center mb-4">
              <picture>
                <source srcset="{% static 'main/img/logo.webp' %}" type="image/webp" />
                <img
                  src="{% static 'main/img/logo.png' %}"
                  alt="Vraa logo"
                  class="img-fluid"
                />
              </picture>
            </div>
            <ul class="nav flex-column">
              <li class="nav-item">
                <a
                  class="nav-link {% if title == 'Frontpage' %}active{% endif %}"
                  aria-current="page"
                  href="{% url 'main:frontpage' %}"
                  >Frontpage</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link {% if title == 'Information' %}active{% endif %}"
                  href="{% url 'main:information' %}"
                  >Information</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link {% if title == 'Referater' %}active{% endif %}"
                  href="{% url 'main:referater' %}"
                  >Referater</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link {% if title == 'Vedtægter' %}active{% endif %}"
                  href="{% url 'main:vedtaegter' %}"
                  >Vedtægter</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link {% if title == 'Kalender' %}active{% endif %}"
                  href="{% url 'main:kalender' %}"
                  >Kalender</a
                >
              </li>
            </ul>

            <!-- User authentication status -->
            <div class="user-status">
                {% if user.is_authenticated %}
                <p class="mb-2">Logget ind som <strong>{{ user.username }}</strong></p>
                <a href="{% url 'main:logout' %}" class="btn btn-outline-secondary btn-sm w-100">Log ud</a>
                {% else %}
                <a href="{% url 'main:login' %}" class="btn btn-primary btn-sm w-100 mb-2">Log ind</a>
                <a href="{% url 'main:register' %}" class="btn btn-outline-secondary btn-sm w-100">Registrer</a>
                {% endif %}
            </div>
          </div>
        </nav>

        <!-- Main content (centered column) -->
        <main class="col-12 col-md-9 col-lg-10 px-4">
          <div class="mx-auto content">
            {% block content %}{% endblock %}
          </div>
        </main>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
