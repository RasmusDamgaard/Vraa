{% extends 'main/base.html' %}

{% block content %}
<div class="auth-container">
    <h1>E-mail sendt</h1>
    <div class="alert alert-success">
        <p>Vi har sendt dig en e-mail med instruktioner til at nulstille din adgangskode.</p>
        <p>Hvis du ikke modtager en e-mail inden for et par minutter, kontroller venligst din spam-mappe.</p>
    </div>

    <p class="mt-4 text-center">
        <a href="{% url 'main:login' %}">Tilbage til log ind</a>
    </p>
</div>
{% endblock %}
