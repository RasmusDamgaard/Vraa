{% extends 'main/base.html' %}

{% block content %}
<div class="delete-confirm-container">
    <h1>Slet kommentar</h1>

    <div class="callout warning">
        <span class="callout-icon">&#9888;</span>
        <div>
            <p><strong>Er du sikker på, at du vil slette denne kommentar?</strong></p>
            <blockquote style="border-left:3px solid var(--border);padding-left:1rem;font-style:italic;margin:1rem 0;">
                {{ object.content|truncatewords:50 }}
            </blockquote>
            <p class="mb-0 text-muted">Denne handling kan ikke fortrydes.</p>
        </div>
    </div>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Ja, slet kommentar</button>
            <a href="{% url 'main:frontpage' %}" class="btn btn-outline">Annuller</a>
        </div>
    </form>
</div>
{% endblock %}
