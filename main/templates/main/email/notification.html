<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ notification.title }}</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
        }
        .header {
            background: #2C5F7C;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .content {
            padding: 30px 20px;
            background: #ffffff;
        }
        .content h2 {
            color: #2C5F7C;
            margin-top: 0;
            font-size: 20px;
        }
        .content p {
            margin: 15px 0;
            color: #555;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #5FA8A0;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            margin-top: 10px;
        }
        .button:hover {
            background: #4a9690;
        }
        .footer {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 12px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }
        .footer a {
            color: #5FA8A0;
            text-decoration: none;
        }
        .message-box {
            background: #F4E9D8;
            border-radius: 8px;
            padding: 15px;
            margin: 20px 0;
            border-left: 4px solid #5FA8A0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Vraa Sommerhus</h1>
        </div>
        <div class="content">
            <h2>{{ notification.title }}</h2>
            <div class="message-box">
                <p>{{ notification.message }}</p>
            </div>
            {% if notification.link %}
            <p>
                <a href="{{ site_url }}{{ notification.link }}" class="button">Se på hjemmesiden</a>
            </p>
            {% endif %}
        </div>
        <div class="footer">
            <p>Du modtager denne e-mail fordi du har tilmeldt dig notifikationer på vraa.org</p>
            <p>Du kan ændre dine notifikationsindstillinger i din <a href="{{ site_url }}/profil/rediger/">profil</a></p>
        </div>
    </div>
</body>
</html>
