[project]
name = "vraa"
version = "1.0.0"
description = "A Django-based web application for the Vraa family vacation home"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=4.0,<5.0",
    "gunicorn==21.2.0",
    "whitenoise==6.6.0",
    "dj-database-url==2.1.0",
    "psycopg2-binary==2.9.9",
    "requests>=2.31.0",
    "django-ratelimit>=4.0.0",
    "django-csp>=3.8",
    "sentry-sdk>=1.0",
]

[project.optional-dependencies]
dev = [
    "django-stubs",
    "mypy",
    "pytest>=7.0",
    "pytest-django>=4.5",
    "pytest-cov>=4.0",
    "factory-boy>=3.3",
    "faker>=18.0",
]

[tool.uv]
# UV-specific configuration
# Use no-package mode since this is a Django application, not a library
package = false

[tool.django]
# Django-specific settings can be referenced here if needed
settings-module = "Vraa.settings"
